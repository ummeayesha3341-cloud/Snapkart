services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snapkart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
      POSTGRES_DB: ${POSTGRES_DB:-snapkart}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - snapkart-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapkart} -d ${POSTGRES_DB:-snapkart}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  snapkart-postgres:
